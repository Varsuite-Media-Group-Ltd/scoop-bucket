name: CI

# Varsuite standard pipeline. Do not edit this file per repository: it is
# generated by scripts/rollout.sh and every repository gets an identical copy.
# The checks themselves live in Varsuite-Media-Group-Ltd/github-actions.
#
# Pinned to @v1, not @main. A reusable workflow referenced by branch runs
# whatever is on that branch right now, in every repository, with access to
# GH_COMPOSER_READ and DEEPSEEK_API_KEY. That makes any commit to the pipeline
# repository an immediate org-wide deployment, including a broken one.
# The v1 tag is moved deliberately by scripts/release.sh instead.

on:
  workflow_dispatch:
  pull_request:
  push:
    branches: [main]
  # A weekly run on main catches drift nobody pushed: an expired snapshot, a
  # dependency that moved, a pipeline release. A failure opens a "CI failing in
  # <repo>" card in the CRM, which the weekly maintenance routine picks up.
  schedule:
    - cron: '17 3 * * 0'

# The fix loop pushes repeatedly. Without this, a five-commit fix session runs
# five overlapping pipelines and bills for four of them.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  qa:
    # Read-only. Only the review job needs to write to the pull request, and a
    # workflow-level grant would hand that write access to this job too.
    permissions:
      contents: read
    uses: Varsuite-Media-Group-Ltd/github-actions/.github/workflows/qa.yml@v1
    secrets:
      GH_COMPOSER_READ: ${{ secrets.GH_COMPOSER_READ }}

  ai-review:
    needs: qa
    # Runs even when QA fails, deliberately. Getting the static-analysis errors
    # and the review findings in the same pass means one fix cycle, not two.
    if: ${{ !cancelled() && github.event_name == 'pull_request' }}
    permissions:
      contents: read
      pull-requests: write
    uses: Varsuite-Media-Group-Ltd/github-actions/.github/workflows/ai-code-review.yml@v1
    with:
      migration-findings: ${{ needs.qa.outputs.destructive-migrations }}
    secrets:
      DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
